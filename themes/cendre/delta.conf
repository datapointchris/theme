# Cendre - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#4f2732"
    minus-emph-style = syntax "#7c384d"
    plus-style = syntax "#223926"
    plus-emph-style = syntax "#2a5737"

    line-numbers-minus-style = "#d25780"
    line-numbers-plus-style = "#43b16a"
    line-numbers-zero-style = "#73665b"
    line-numbers-left-style = "#73665b"
    line-numbers-right-style = "#73665b"

    file-style = "#4e89a2" bold
    file-decoration-style = "#73665b" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#73665b" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#171311 #201b19 #2a2422"
    merge-conflict-ours-diff-header-style = "#fcba81" bold
    merge-conflict-theirs-diff-header-style = "#fcba81" bold
