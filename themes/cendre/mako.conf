# Cendre - Mako notification colors
# Generated from theme.yml
# Author: Aejkatappaja

# Default colors - use info/accent for normal state
text-color=#e6d5c2
background-color=#171311
border-color=#58bdff
progress-color=over #ea9875

# Low urgency - subtle hint color
[urgency=low]
text-color=#a09384
background-color=#171311
border-color=#20c9cb

# Normal urgency - info/accent color
[urgency=normal]
text-color=#e6d5c2
background-color=#171311
border-color=#58bdff

# Critical urgency - error color for maximum visibility
[urgency=critical]
text-color=#e6d5c2
background-color=#201b19
border-color=#d25780
