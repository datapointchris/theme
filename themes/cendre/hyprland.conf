# Cendre - hyprland theme
# Generated from theme.yml
# Author: Aejkatappaja

# =============================================================================
# COLOR VARIABLES (Base16)
# =============================================================================

$base00 = rgb(171311)  # Main background
$base01 = rgb(201b19)  # Lighter background
$base02 = rgb(2a2422)  # Selection
$base03 = rgb(73665b)  # Comments
$base04 = rgb(a09384)  # Dark foreground
$base05 = rgb(e6d5c2)  # Foreground
$base06 = rgb(e6d5c2)  # Light foreground
$base07 = rgb(e6d5c2)  # Brightest
$base08 = rgb(d1766e)  # Red
$base09 = rgb(ea9875)  # Orange
$base0A = rgb(fcba81)  # Yellow
$base0B = rgb(99af6b)  # Green
$base0C = rgb(20c9cb)  # Cyan
$base0D = rgb(4e89a2)  # Blue
$base0E = rgb(9480ba)  # Magenta
$base0F = rgb(ea9875)  # Brown

# =============================================================================
# EXTENDED PALETTE (when available)
# =============================================================================

$uiAccent = rgb(ea9875)
$uiBorder = rgb(362f2c)

# =============================================================================
# SEMANTIC COLORS
# =============================================================================

$activeBorderColor = $uiAccent
$inactiveBorderColor = $uiBorder
$groupActiveBorderColor = $base0E
$groupInactiveBorderColor = $base03
$groupLockedActiveBorderColor = $base09
$groupLockedInactiveBorderColor = $base01

# =============================================================================
# WINDOW BORDERS
# =============================================================================

general {
    col.active_border = $activeBorderColor
    col.inactive_border = $inactiveBorderColor
}

# =============================================================================
# GROUP BORDERS
# =============================================================================

group {
    col.border_active = $groupActiveBorderColor
    col.border_inactive = $groupInactiveBorderColor
    col.border_locked_active = $groupLockedActiveBorderColor
    col.border_locked_inactive = $groupLockedInactiveBorderColor
}
