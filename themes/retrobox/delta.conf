# Retrobox - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#5d2923"
    minus-emph-style = syntax "#923429"
    plus-style = syntax "#3a3a1e"
    plus-emph-style = syntax "#565720"

    line-numbers-minus-style = "#fb4934"
    line-numbers-plus-style = "#b8bb26"
    line-numbers-zero-style = "#928374"
    line-numbers-left-style = "#928374"
    line-numbers-right-style = "#928374"

    file-style = "#83a598" bold
    file-decoration-style = "#928374" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#928374" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#1c1c1c #3c3836 #504945"
    merge-conflict-ours-diff-header-style = "#fabd2f" bold
    merge-conflict-theirs-diff-header-style = "#fabd2f" bold
