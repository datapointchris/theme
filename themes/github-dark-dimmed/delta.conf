# GitHub Dark Dimmed - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#5e3537"
    minus-emph-style = syntax "#95413f"
    plus-style = syntax "#2c4636"
    plus-emph-style = syntax "#37663e"

    line-numbers-minus-style = "#e5534b"
    line-numbers-plus-style = "#46954a"
    line-numbers-zero-style = "#768390"
    line-numbers-left-style = "#768390"
    line-numbers-right-style = "#768390"

    file-style = "#6cb6ff" bold
    file-decoration-style = "#768390" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#768390" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#22272e #2d333b #373e47"
    merge-conflict-ours-diff-header-style = "#c69026" bold
    merge-conflict-theirs-diff-header-style = "#c69026" bold
