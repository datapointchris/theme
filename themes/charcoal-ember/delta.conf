# Charcoal Ember - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#731610"
    minus-emph-style = syntax "#8d130c"
    plus-style = syntax "#2c402e"
    plus-emph-style = syntax "#395e39"

    line-numbers-minus-style = "#c90d00"
    line-numbers-plus-style = "#60b45a"
    line-numbers-zero-style = "#969896"
    line-numbers-left-style = "#969896"
    line-numbers-right-style = "#969896"

    file-style = "#4eb6fe" bold
    file-decoration-style = "#969896" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#969896" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#1d1f21 #2d2d2d #373b41"
    merge-conflict-ours-diff-header-style = "#ffc400" bold
    merge-conflict-theirs-diff-header-style = "#ffc400" bold
