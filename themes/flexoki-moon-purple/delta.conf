# Flexoki Moon Purple - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#512429"
    minus-emph-style = syntax "#833432"
    plus-style = syntax "#303424"
    plus-emph-style = syntax "#49512a"

    line-numbers-minus-style = "#d14d41"
    line-numbers-plus-style = "#879a39"
    line-numbers-zero-style = "#625f68"
    line-numbers-left-style = "#625f68"
    line-numbers-right-style = "#625f68"

    file-style = "#4385be" bold
    file-decoration-style = "#625f68" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#625f68" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#12101d #1c1a25 #1f1d2a"
    merge-conflict-ours-diff-header-style = "#d0a215" bold
    merge-conflict-theirs-diff-header-style = "#d0a215" bold
