# Cendre Soft - Dunst notification colors
# Generated from theme.yml
# Author: Aejkatappaja

[global]
    # Separator between notifications - use UI border color
    separator_color = "#443c39"

    # Progress bar colors - use accent
    highlight = "#ea9875"

[urgency_low]
    # Low priority - subtle hint color
    background = "#231f1d"
    foreground = "#a09384"
    frame_color = "#20c9cb"
    highlight = "#20c9cb"
    timeout = 5

[urgency_normal]
    # Normal priority - info/accent color
    background = "#231f1d"
    foreground = "#e6d5c2"
    frame_color = "#58bdff"
    highlight = "#58bdff"
    timeout = 10

[urgency_critical]
    # Critical priority - error color for maximum visibility
    background = "#2d2725"
    foreground = "#e6d5c2"
    frame_color = "#d25780"
    highlight = "#d25780"
    timeout = 0
