extended_source: hedinne/popping-and-locking-vscode
# The syntax palette is solved against this theme's own background rather than
# transcribed. Each slot below names its OKLCH lightness, chroma and hue, because
# the separations between them are what the choices are made on: two roles that
# sit next to each other in a buffer need a gap on at least one of the three.
#
# The reds are the exception that shaped the rest. #f42c3e carried chroma 0.231
# where every other color here sits at 0.16 or below, and six roles resolved to
# it or to #cc241d, punctuation among them. Keywords are blue now and the reds
# are down to 0.155, which is the palette's own ceiling.
extended:
  diagnostic_error: '#cc5351'
  diagnostic_ok: '#7fc678'
  diagnostic_warning: '#e1656a'
  diagnostic_info: '#689d6a'
  diagnostic_hint: '#689d6a'
  syntax_comment: '#7a7064'      # L .551 C .022 H 72. Warm, so it carries no hue in common with the keyword blue
  syntax_string: '#92d3a3'       # L .810 C .095 H 152. In the theme's own green family, where #b8bb26 sat 40 degrees away at hue 111
  syntax_function: '#7ec16e'     # L .746 C .133 H 140
  syntax_keyword: '#7398dc'      # L .680 C .109 H 262. Also statement and preproc, so def, class, import, if and for agree
  syntax_statement: '#7398dc'    # if, for, while, else
  syntax_type: '#fabd2f'
  syntax_number: '#d3869b'
  syntax_constant: '#d3869b'
  syntax_operator: '#a89984'     # base04. Operators are structure, like punctuation, rather than meaning
  syntax_identifier: '#4fa1a5'   # L .659 C .080 H 200, 5.81:1. self.accents and every @variable.member, which base0D drew at 4.14:1
  syntax_variable: '#99c6ca'
  syntax_parameter: '#99c6ca'
  syntax_preproc: '#7398dc'
  syntax_special: '#689d6a'
  syntax_punctuation: '#c59d5d'  # L .719 C .095 H 78. Chroma held to the string's, because punctuation is the densest token class in a file
  syntax_tag: '#7398dc'
  syntax_attribute: '#99c6ca'
  ui_accent: '#458588'
  ui_border: '#ebdbb2'
  ui_selection: '#383637'  # base02, for the reason given there
  ui_float_bg: '#252631'  # Matches base01
  ui_cursor_line: '#252631'  # Matches base01
  git_add: '#63ac6f'
  git_change: '#d79921'
  git_delete: '#cc5351'
