# Nordic - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#513d47"
    minus-emph-style = syntax "#7d515a"
    plus-style = syntax "#3b4443"
    plus-emph-style = syntax "#536054"

    line-numbers-minus-style = "#C5727A"
    line-numbers-plus-style = "#A3BE8C"
    line-numbers-zero-style = "#4C566A"
    line-numbers-left-style = "#4C566A"
    line-numbers-right-style = "#4C566A"

    file-style = "#81A1C1" bold
    file-decoration-style = "#4C566A" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#4C566A" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#242933 #2E3440 #3B4252"
    merge-conflict-ours-diff-header-style = "#EBCB8B" bold
    merge-conflict-theirs-diff-header-style = "#EBCB8B" bold
