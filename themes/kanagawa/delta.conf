# Kanagawa - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#6b2126"
    minus-emph-style = syntax "#a22225"
    plus-style = syntax "#363d35"
    plus-emph-style = syntax "#4d5a42"

    line-numbers-minus-style = "#e82424"
    line-numbers-plus-style = "#98bb6c"
    line-numbers-zero-style = "#727169"
    line-numbers-left-style = "#727169"
    line-numbers-right-style = "#727169"

    file-style = "#7e9cd8" bold
    file-decoration-style = "#727169" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#727169" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#1f1f28 #16161d #2d4f67"
    merge-conflict-ours-diff-header-style = "#c0a36e" bold
    merge-conflict-theirs-diff-header-style = "#c0a36e" bold
