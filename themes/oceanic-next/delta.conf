# Oceanic Next - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#563b44"
    minus-emph-style = syntax "#8e4951"
    plus-style = syntax "#2e4846"
    plus-emph-style = syntax "#456457"

    line-numbers-minus-style = "#ec5f67"
    line-numbers-plus-style = "#99c794"
    line-numbers-zero-style = "#65737e"
    line-numbers-left-style = "#65737e"
    line-numbers-right-style = "#65737e"

    file-style = "#6699cc" bold
    file-decoration-style = "#65737e" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#65737e" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#162c35 #65737e #4f5b66"
    merge-conflict-ours-diff-header-style = "#fac863" bold
    merge-conflict-theirs-diff-header-style = "#fac863" bold
