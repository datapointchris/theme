# Sora - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#432b34"
    minus-emph-style = syntax "#6d404a"
    plus-style = syntax "#243433"
    plus-emph-style = syntax "#365349"

    line-numbers-minus-style = "#c46c78"
    line-numbers-plus-style = "#68a888"
    line-numbers-zero-style = "#586478"
    line-numbers-left-style = "#586478"
    line-numbers-right-style = "#586478"

    file-style = "#80c8e0" bold
    file-decoration-style = "#586478" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#586478" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#0e1018 #14161e #1e2430"
    merge-conflict-ours-diff-header-style = "#d4b878" bold
    merge-conflict-theirs-diff-header-style = "#d4b878" bold
