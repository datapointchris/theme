  syntax_number: "#d4b878"
  syntax_constant: "#d4b878"
  syntax_variable: "#b4bcd0"
  syntax_parameter: "#d0a888"
  syntax_function: "#80c8e0"
  syntax_keyword: "#b0a0d8"
  syntax_type: "#d0a888"
  syntax_operator: "#8898b8"
  syntax_punctuation: "#9aa4b8"
  syntax_tag: "#78b8b0"
  syntax_attribute: "#d0a888"
  syntax_preproc: "#b0a0d8"
  syntax_special: "#b0a0d8"
  diagnostic_error: "#c46c78"
  diagnostic_warning: "#c8a860"
  diagnostic_info: "#5ca8c8"
  diagnostic_hint: "#78b0a0"
  diagnostic_ok: "#68a888"
  git_add: "#68b080"
  git_change: "#6898b8"
  git_delete: "#b86068"
