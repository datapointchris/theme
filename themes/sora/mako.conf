# Sora - Mako notification colors
# Generated from theme.yml
# Author: Aejkatappaja

# Default colors - use info/accent for normal state
text-color=#c8d0e0
background-color=#0e1018
border-color=#5ca8c8
progress-color=over #80c8e0

# Low urgency - subtle hint color
[urgency=low]
text-color=#9aa4b8
background-color=#0e1018
border-color=#78b0a0

# Normal urgency - info/accent color
[urgency=normal]
text-color=#c8d0e0
background-color=#0e1018
border-color=#5ca8c8

# Critical urgency - error color for maximum visibility
[urgency=critical]
text-color=#dce4f0
background-color=#14161e
border-color=#c46c78
