# Sora - Dunst notification colors
# Generated from theme.yml
# Author: Aejkatappaja

[global]
    # Separator between notifications - use UI border color
    separator_color = "#222838"

    # Progress bar colors - use accent
    highlight = "#80c8e0"

[urgency_low]
    # Low priority - subtle hint color
    background = "#0e1018"
    foreground = "#9aa4b8"
    frame_color = "#78b0a0"
    highlight = "#78b0a0"
    timeout = 5

[urgency_normal]
    # Normal priority - info/accent color
    background = "#0e1018"
    foreground = "#c8d0e0"
    frame_color = "#5ca8c8"
    highlight = "#5ca8c8"
    timeout = 10

[urgency_critical]
    # Critical priority - error color for maximum visibility
    background = "#14161e"
    foreground = "#dce4f0"
    frame_color = "#c46c78"
    highlight = "#c46c78"
    timeout = 0
