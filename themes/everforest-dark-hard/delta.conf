# Everforest Dark Hard - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#4c383b"
    minus-emph-style = syntax "#784c4f"
    plus-style = syntax "#373f36"
    plus-emph-style = syntax "#4f5c46"

    line-numbers-minus-style = "#e67e80"
    line-numbers-plus-style = "#a7c080"
    line-numbers-zero-style = "#859289"
    line-numbers-left-style = "#859289"
    line-numbers-right-style = "#859289"

    file-style = "#7fbbb3" bold
    file-decoration-style = "#859289" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#859289" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#1e2326 #2e383c #374145"
    merge-conflict-ours-diff-header-style = "#dbbc7f" bold
    merge-conflict-theirs-diff-header-style = "#dbbc7f" bold
