# Treehouse - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#622014"
    minus-emph-style = syntax "#7c2212"
    plus-style = syntax "#243d13"
    plus-emph-style = syntax "#2d5d0d"

    line-numbers-minus-style = "#b2270e"
    line-numbers-plus-style = "#44a900"
    line-numbers-zero-style = "#504332"
    line-numbers-left-style = "#504332"
    line-numbers-right-style = "#504332"

    file-style = "#58859a" bold
    file-decoration-style = "#504332" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#504332" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#191919 #252220 #786b53"
    merge-conflict-ours-diff-header-style = "#aa820c" bold
    merge-conflict-theirs-diff-header-style = "#aa820c" bold
