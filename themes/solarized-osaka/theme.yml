# Solarized Osaka - Terminal configs matching solarized-osaka.nvim
# Source: craftzdog/solarized-osaka.nvim

meta:
  id: "solarized-osaka"
  display_name: "Solarized Osaka"
  neovim_colorscheme_name: "solarized-osaka"
  neovim_colorscheme_source: "plugin"
  plugin: "craftzdog/solarized-osaka.nvim"
  derived_from: "neovim-plugin"
  variant: "dark"
  author: "Takuya Matsuyama (craftzdog)"

base16:
  base00: "#001419"  # bg (hsl 192, 100, 5)
  base01: "#002b36"  # bg_highlight (hsl 192, 100, 11)
  base02: "#073642"  # base02 (hsl 192, 81, 14)
  base03: "#586e75"  # base01 (hsl 194, 14, 40)
  base04: "#657b83"  # base00 (hsl 196, 13, 45)
  base05: "#839395"  # fg
  base06: "#a9b1b1"  # base0 (hsl 186, 8, 65)
  base07: "#eee8d5"  # base2 (hsl 46, 42, 88)
  base08: "#db302d"  # red
  base09: "#c94c16"  # orange
  base0A: "#b28500"  # yellow
  base0B: "#849900"  # green
  base0C: "#29a298"  # cyan
  base0D: "#268bd3"  # blue
  base0E: "#d23681"  # magenta
  base0F: "#f55350"  # bright red

# Verbatim from the plugin's own extras/ghostty/solarized_osaka_dark. These were
# classic Solarized before, not craftzdog's variant, so the terminal never
# matched the editor. Note the extras/alacritty file disagrees with this one and
# is a year staler; the ghostty file is the one that matches the plugin.
ansi:
  black: "#001419"
  red: "#db302d"
  green: "#849900"
  yellow: "#b28500"
  blue: "#268bd3"
  magenta: "#d23681"
  cyan: "#29a298"
  white: "#fdf5e2"
  bright_black: "#063540"
  bright_red: "#f55350"
  bright_green: "#b7f900"
  bright_yellow: "#ffbf00"
  bright_blue: "#46acf5"
  bright_magenta: "#f254a0"
  bright_cyan: "#2aeddd"
  bright_white: "#ffffff"

special:
  background: "#001419"
  foreground: "#839395"
  cursor: "#839395"
  cursor_text: "#001419"
  selection_bg: "#1a6397"
  selection_fg: "#839395"
  border: "#002b36"
  panel: "#001419"

extended_source: plugin
extended:
  # Diagnostic colors (maps to base16 - solarized uses consistent 16-color palette)
  diagnostic_error: "#db302d"
  diagnostic_warning: "#b28500"
  diagnostic_info: "#268bd3"
  diagnostic_hint: "#29a298"
  diagnostic_ok: "#859900"

  # Syntax colors (maps to base16)
  syntax_comment: "#576d74"
  syntax_string: "#29a298"
  syntax_function: "#268bd3"
  syntax_keyword: "#849900"
  syntax_type: "#b28500"
  syntax_number: "#29a298"
  syntax_constant: "#c94c16"
  syntax_operator: "#849900"
  syntax_variable: "#9eabac"
  syntax_parameter: "#c94c16"
  syntax_preproc: "#db302d"
  syntax_special: "#c94c16"
  syntax_punctuation: "#849900"
  syntax_tag: "#849900"
  syntax_attribute: "#268bd3"

  # UI colors (maps to base16)
  ui_accent: "#268bd3"
  ui_border: "#073642"
  ui_selection: "#073642"
  ui_float_bg: "#002b36"
  ui_cursor_line: "#073642"

  # Git colors (maps to base16)
  git_add: "#849900"
  git_change: "#b28500"
  git_delete: "#db302d"
