# Solarized Osaka - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#581f21"
    minus-emph-style = syntax "#8e2626"
    plus-style = syntax "#233713"
    plus-emph-style = syntax "#40540d"

    line-numbers-minus-style = "#db302d"
    line-numbers-plus-style = "#859900"
    line-numbers-zero-style = "#586e75"
    line-numbers-left-style = "#586e75"
    line-numbers-right-style = "#586e75"

    file-style = "#268bd2" bold
    file-decoration-style = "#586e75" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#586e75" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#001419 #002b36 #073642"
    merge-conflict-ours-diff-header-style = "#b58900" bold
    merge-conflict-theirs-diff-header-style = "#b58900" bold
