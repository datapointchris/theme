# Rose Pine - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#4b2c3e"
    minus-emph-style = syntax "#783f56"
    plus-style = syntax "#32363f"
    plus-emph-style = syntax "#495359"

    line-numbers-minus-style = "#eb6f92"
    line-numbers-plus-style = "#95b1ac"
    line-numbers-zero-style = "#6e6a86"
    line-numbers-left-style = "#6e6a86"
    line-numbers-right-style = "#6e6a86"

    file-style = "#c4a7e7" bold
    file-decoration-style = "#6e6a86" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#6e6a86" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#191724 #1f1d2e #26233a"
    merge-conflict-ours-diff-header-style = "#ebbcba" bold
    merge-conflict-theirs-diff-header-style = "#ebbcba" bold
