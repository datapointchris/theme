# Smyck - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#582a24"
    minus-emph-style = syntax "#813429"
    plus-style = syntax "#323c15"
    plus-emph-style = syntax "#46590f"

    line-numbers-minus-style = "#b84131"
    line-numbers-plus-style = "#7da900"
    line-numbers-zero-style = "#7a7a7a"
    line-numbers-left-style = "#7a7a7a"
    line-numbers-right-style = "#7a7a7a"

    file-style = "#62a3c4" bold
    file-decoration-style = "#7a7a7a" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#7a7a7a" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#1b1b1b #2b2b2b #207483"
    merge-conflict-ours-diff-header-style = "#c4a500" bold
    merge-conflict-theirs-diff-header-style = "#c4a500" bold
