# Nightfox - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#553245"
    minus-emph-style = syntax "#8a3f57"
    plus-style = syntax "#2e4045"
    plus-emph-style = syntax "#435c5a"

    line-numbers-minus-style = "#c94f6d"
    line-numbers-plus-style = "#81b29a"
    line-numbers-zero-style = "#738091"
    line-numbers-left-style = "#738091"
    line-numbers-right-style = "#738091"

    file-style = "#719cd6" bold
    file-decoration-style = "#738091" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#738091" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#192330 #212e3f #29394f"
    merge-conflict-ours-diff-header-style = "#dbc074" bold
    merge-conflict-theirs-diff-header-style = "#dbc074" bold
