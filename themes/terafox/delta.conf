# Terafox - delta theme
# Generated from theme.yml — do not edit; run 'theme apply' to regenerate

[delta]
    # Tracks whatever bat theme is currently applied; theme rewrites
    # ~/.config/bat/themes/current.tmTheme and rebuilds the bat cache on apply.
    syntax-theme = current

    minus-style = syntax "#543634"
    minus-emph-style = syntax "#89433f"
    plus-style = syntax "#2b4143"
    plus-emph-style = syntax "#415d5d"

    line-numbers-minus-style = "#e85c51"
    line-numbers-plus-style = "#7aa4a1"
    line-numbers-zero-style = "#6d7f8b"
    line-numbers-left-style = "#6d7f8b"
    line-numbers-right-style = "#6d7f8b"

    file-style = "#5a93aa" bold
    file-decoration-style = "#6d7f8b" ul
    hunk-header-style = file line-number syntax
    hunk-header-decoration-style = "#6d7f8b" box
    # Quoted because an unquoted '#' begins a comment in git config, which would
    # silently truncate this to empty and make delta abort on every invocation.
    blame-palette = "#152528 #1d3337 #254147"
    merge-conflict-ours-diff-header-style = "#fda47f" bold
    merge-conflict-theirs-diff-header-style = "#fda47f" bold
